<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">StudentHub low-fidelity home page wireframe</title>
  <desc id="description">A desktop portal layout with header navigation, notification banner, quick links sidebar, welcome section, featured event cards, and footer.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #222; }
    .label { font-size: 18px; font-weight: bold; }
    .small { font-size: 14px; }
    .box { fill: #fff; stroke: #333; stroke-width: 2; }
    .muted { fill: #eee; stroke: #333; stroke-width: 2; }
  </style>
  <rect x="1" y="1" width="1198" height="898" fill="#fafafa" stroke="#777" stroke-width="2"/>

  <rect class="muted" x="30" y="30" width="1140" height="120" rx="6"/>
  <text class="label" x="55" y="75">StudentHub</text>
  <text class="small" x="55" y="112">Logo / portal name</text>
  <rect class="box" x="315" y="55" width="670" height="65" rx="4"/>
  <text class="label" x="340" y="95">Home | About | Events | FAQ | Contact | Register | Login</text>
  <rect class="box" x="1010" y="65" width="135" height="45" rx="4"/>
  <text class="small" x="1025" y="93">Theme toggle</text>

  <rect class="muted" x="30" y="170" width="1140" height="65" rx="6"/>
  <text class="label" x="55" y="210">Notification banner: important campus update</text>

  <rect class="box" x="30" y="255" width="250" height="495" rx="6"/>
  <text class="label" x="55" y="295">Quick links</text>
  <rect class="muted" x="55" y="320" width="200" height="55" rx="4"/>
  <text class="small" x="72" y="353">Upcoming events</text>
  <rect class="muted" x="55" y="390" width="200" height="55" rx="4"/>
  <text class="small" x="72" y="423">Student registration</text>
  <rect class="muted" x="55" y="460" width="200" height="55" rx="4"/>
  <text class="small" x="72" y="493">Contact support</text>

  <rect class="box" x="305" y="255" width="865" height="245" rx="6"/>
  <text class="label" x="345" y="305">Welcome to StudentHub</text>
  <text class="small" x="345" y="350">Portal introduction and short description</text>
  <text class="small" x="345" y="378">Academic activities, events and student information</text>
  <rect class="muted" x="345" y="410" width="155" height="55" rx="4"/>
  <text class="small" x="375" y="443">Register now</text>
  <rect class="muted" x="520" y="410" width="125" height="55" rx="4"/>
  <text class="small" x="552" y="443">Sign in</text>

  <text class="label" x="305" y="545">Featured events</text>
  <rect class="box" x="305" y="565" width="270" height="185" rx="6"/>
  <text class="label" x="330" y="610">Event card 1</text>
  <text class="small" x="330" y="645">Title, date and summary</text>
  <text class="small" x="330" y="672">Details link</text>
  <rect class="box" x="602" y="565" width="270" height="185" rx="6"/>
  <text class="label" x="627" y="610">Event card 2</text>
  <text class="small" x="627" y="645">Title, date and summary</text>
  <text class="small" x="627" y="672">Details link</text>
  <rect class="box" x="899" y="565" width="271" height="185" rx="6"/>
  <text class="label" x="924" y="610">Event card 3</text>
  <text class="small" x="924" y="645">Title, date and summary</text>
  <text class="small" x="924" y="672">Details link</text>

  <rect class="muted" x="30" y="775" width="1140" height="85" rx="6"/>
  <text class="label" x="55" y="815">Footer</text>
  <text class="small" x="55" y="840">Copyright, contact and policy links</text>
</svg>
